<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>知识库问答系统</title>
<style>
  :root {
    --bg: #fafafa;
    --card: #ffffff;
    --ink: #111111;
    --muted: #6b6b6b;
    --line: #e4e4e4;
    --accent: #111111;
    --warn-bg: #f7f4ec;
    --warn-ink: #7a5c12;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans SC",
                 "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 56px 24px 80px; }

  header { margin-bottom: 40px; }
  h1 { font-size: 20px; font-weight: 600; letter-spacing: -0.01em; margin: 0 0 8px; }
  .sub { font-size: 12.5px; color: var(--muted); line-height: 1.7; }
  .dot { display: inline-block; width: 5px; height: 5px; background: #16a34a;
         border-radius: 50%; margin-right: 6px; vertical-align: middle; }

  .ask {
    background: var(--card);
    border: 1px solid var(--line);
    padding: 18px 18px 14px;
    margin-bottom: 28px;
  }
  textarea {
    width: 100%; border: 0; outline: 0; resize: none;
    font: inherit; font-size: 15.5px; line-height: 1.65;
    color: var(--ink); background: transparent; min-height: 54px;
  }
  textarea::placeholder { color: #a8a8a8; }
  .bar {
    display: flex; align-items: center; justify-content: space-between;
    border-top: 1px solid #f0f0f0; margin-top: 10px; padding-top: 12px;
  }
  .hint { font-size: 11.5px; color: #9a9a9a; }
  button {
    font: inherit; font-size: 13px; padding: 8px 18px;
    background: var(--accent); color: #fff; border: 0; cursor: pointer;
    letter-spacing: .02em;
  }
  button:disabled { background: #c9c9c9; cursor: default; }

  .answer { display: none; }
  .answer.show { display: block; }
  .meta { font-size: 11.5px; color: var(--muted); margin-bottom: 10px;
          display: flex; gap: 14px; flex-wrap: wrap; }
  .meta b { font-weight: 600; color: var(--ink); }
  .body-text {
    font-size: 16px; line-height: 1.85; white-space: pre-wrap;
    background: var(--card); border: 1px solid var(--line); padding: 20px 22px;
  }
  .refused {
    background: var(--warn-bg); border: 1px solid #e8dfc8;
    color: var(--warn-ink); padding: 18px 20px; font-size: 15px; line-height: 1.8;
  }
  .refused small { display: block; color: #9a8a63; font-size: 11.5px; margin-top: 6px; }

  .sources { margin-top: 18px; }
  .sources-title {
    font-size: 11.5px; color: var(--muted); letter-spacing: .06em;
    text-transform: uppercase; margin-bottom: 10px;
  }
  .hit {
    background: var(--card); border: 1px solid var(--line);
    padding: 12px 14px; margin-bottom: 8px; font-size: 13px; line-height: 1.7;
  }
  .hit-top { display: flex; gap: 10px; align-items: baseline; margin-bottom: 6px; }
  .page {
    font-size: 11px; font-weight: 600; letter-spacing: .04em;
    border: 1px solid #d8d8d8; padding: 1px 6px; white-space: nowrap;
  }
  .chapter { color: var(--muted); font-size: 12px; flex: 1;
             overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .score { color: #9a9a9a; font-size: 11px; font-variant-numeric: tabular-nums; }
  .snippet { color: #4a4a4a; font-size: 12.5px;
             display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
             overflow: hidden; }

  .loading { display: none; font-size: 13px; color: var(--muted); padding: 8px 0 20px; }
  .loading.show { display: block; }
  .err { color: #b91c1c; font-size: 13px; padding: 12px 0; }

  footer { margin-top: 56px; font-size: 11.5px; color: #a0a0a0; line-height: 1.9; }
  footer code { background: #f1f1f1; padding: 1px 5px; font-size: 11px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>知识库问答系统</h1>
    <div class="sub">
      <span class="dot"></span>基于 The Anabolic Cookbook 2.0 · 180 个知识块<br>
      只回答本书内容，每个事实附页码；书中没有的会明确告知未找到。
    </div>
  </header>

  <div class="ask">
    <textarea id="q" rows="2" placeholder="输入问题，例如：How do I make protein French toast?"></textarea>
    <div class="bar">
      <span class="hint">Enter 发送 · Shift+Enter 换行</span>
      <button id="send">提问</button>
    </div>
  </div>

  <div class="loading" id="loading">检索知识库中…</div>
  <div class="answer" id="ans">
    <div class="meta" id="meta"></div>
    <div id="body"></div>
    <div class="sources" id="sources"></div>
  </div>

  <footer>
    检索：bge-m3 向量 + IDF 词汇双路 → bge-reranker-v2-m3 精排<br>
    生成：Qwen3-8B · 拒答阈值 0.3 / 词汇放行 0.85<br>
    <code>python webui.py</code> 启动 · <code>python demo_offline.py</code> 离线查看留痕
  </footer>
</div>

<script>
const $ = id => document.getElementById(id);
const qEl = $('q'), sendBtn = $('send'), loading = $('loading'), ans = $('ans');

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}

async function ask() {
  const question = qEl.value.trim();
  if (!question) return;
  sendBtn.disabled = true;
  loading.classList.add('show');
  ans.classList.remove('show');
  const t0 = performance.now();

  try {
    const r = await fetch('/api/ask', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question })
    });
    const d = await r.json();
    if (d.error) throw new Error(d.error);
    const ms = Math.round(performance.now() - t0);

    $('meta').innerHTML =
      `<span>检索分 <b>${(d.top_score ?? 0).toFixed(4)}</b></span>` +
      `<span>词汇分 <b>${(d.lex_best ?? 0).toFixed(2)}</b></span>` +
      `<span>耗时 <b>${ms} ms</b></span>`;

    const bodyEl = $('body');
    if (d.refused) {
      bodyEl.innerHTML = `<div class="refused">${esc(d.answer)}
        <small>本书未覆盖该问题 → 未调用模型生成，避免编造</small></div>`;
    } else {
      bodyEl.innerHTML = `<div class="body-text">${esc(d.answer)}</div>`;
    }

    const hits = d.hits || [];
    if (hits.length) {
      $('sources').innerHTML =
        `<div class="sources-title">检索到的原文片段 · 共 ${hits.length} 块</div>` +
        hits.map(h => {
          const p = h.page_start === h.page_end
            ? `p.${h.page_start}` : `p.${h.page_start}–${h.page_end}`;
          return `<div class="hit">
            <div class="hit-top">
              <span class="page">${p}</span>
              <span class="chapter">${esc(h.chapter)}</span>
              <span class="score">${h.score}</span>
            </div>
            <div class="snippet">${esc(h.snippet)}</div>
          </div>`;
        }).join('');
    } else {
      $('sources').innerHTML = '';
    }
    ans.classList.add('show');
  } catch (e) {
    ans.classList.add('show');
    $('meta').innerHTML = '';
    $('body').innerHTML = `<div class="err">请求失败：${esc(e.message)}</div>`;
    $('sources').innerHTML = '';
  } finally {
    loading.classList.remove('show');
    sendBtn.disabled = false;
  }
}

sendBtn.addEventListener('click', ask);
qEl.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); ask(); }
});
qEl.focus();
</script>
</body>
</html>
