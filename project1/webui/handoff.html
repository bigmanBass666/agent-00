<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>人工工作台 · 知识库问答</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #fdfdfb; color: #1c1c1c; font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; padding: 48px 24px; }
  .wrap { max-width: 1040px; margin: 0 auto; }
  h1 { font-size: 22px; font-weight: 600; letter-spacing: .02em; }
  .sub { font-size: 13px; color: #8a8a86; margin-top: 8px; line-height: 1.7; }
  .stat { display: flex; gap: 28px; margin: 28px 0 24px; padding: 16px 0; border-top: 1px solid #eae7dd; border-bottom: 1px solid #eae7dd; }
  .stat b { font-size: 24px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 12px; color: #8a8a86; display: block; margin-top: 4px; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th { text-align: left; font-weight: 500; font-size: 11.5px; color: #9a9a96; padding: 0 12px 10px; border-bottom: 1px solid #eae7dd; letter-spacing: .08em; }
  td { padding: 14px 12px; border-bottom: 1px solid #f2f0ea; vertical-align: top; line-height: 1.6; }
  .qid { font-family: ui-monospace, Menlo, monospace; font-size: 12.5px; color: #6b5f3f; }
  .q { max-width: 480px; }
  .time { color: #9a9a96; font-size: 12px; white-space: nowrap; }
  .st { font-size: 12px; padding: 3px 8px; border: 1px solid #e0d9c4; }
  .st.pending { color: #a06a12; background: #fbf6e6; border-color: #ead9a8; }
  .st.resolved { color: #3c7a4e; background: #eef6f0; border-color: #cfe4d6; }
  button { font: inherit; font-size: 12px; padding: 5px 12px; background: #1c1c1c; color: #fff; border: 0; cursor: pointer; }
  button:hover { background: #3a3a3a; }
  button:disabled { background: #cfcfcf; cursor: default; }
  .empty { padding: 40px 0; color: #a0a0a0; font-size: 13.5px; text-align: center; }
  footer { margin-top: 40px; font-size: 11.5px; color: #a0a0a0; }
  footer a { color: #6b5f3f; }
</style>
</head>
<body>
<div class="wrap">
  <h1>人工工作台</h1>
  <div class="sub">AI 答不上来的问题会自动转成工单落在这里。模型继续休息，人再上岗。</div>

  <div class="stat">
    <div><b id="pending">0</b><span>待处理</span></div>
    <div><b id="resolved">0</b><span>已处理</span></div>
    <div><b id="total">0</b><span>累计</span></div>
  </div>

  <table>
    <thead><tr><th>工单号</th><th>问题</th><th>时间</th><th>状态</th><th>操作</th></tr></thead>
    <tbody id="rows"><tr><td colspan="5" class="empty">加载中…</td></tr></tbody>
  </table>

  <footer><a href="/">← 返回问答</a> · 数据文件 tickets.jsonl · 每 10 秒自动刷新</footer>
</div>

<script>
async function load() {
  try {
    const r = await fetch('/api/tickets');
    const rows = await r.json();
    const pending = rows.filter(x => x.status === 'pending').length;
    const resolved = rows.length - pending;
    $('pending').textContent = pending;
    $('resolved').textContent = resolved;
    $('total').textContent = rows.length;
    if (!rows.length) {
      $('rows').innerHTML = '<tr><td colspan="5" class="empty">暂无工单 · 所有问题都被知识库覆盖了</td></tr>';
      return;
    }
    $('rows').innerHTML = rows.map(x => `
      <tr>
        <td class="qid">${esc(x.id)}</td>
        <td class="q">${esc(x.question)}</td>
        <td class="time">${esc(x.time)}</td>
        <td><span class="st ${x.status}">${x.status === 'pending' ? '待接入' : '已处理'}</span></td>
        <td>${x.status === 'pending'
          ? `<button onclick="resolve('${x.id}')">开始处理</button>` : ''}</td>
      </tr>`).join('');
  } catch (e) {
    $('rows').innerHTML = `<tr><td colspan="5" class="empty">加载失败：${esc(e.message)}</td></tr>`;
  }
}
async function resolve(id) {
  await fetch('/api/tickets/resolve', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ id })
  });
  load();
}
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g,
  c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
load();
setInterval(load, 10000);
</script>
</body>
</html>
