<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1280">
  <title>失败案例1</title>
  <script src="https://static.ima.qq.com/ima/pptxgen/ajax/libs/tailwind/3.4.17/index.js"></script>
  <link href="https://static.ima.qq.com/ima/pptxgen/ajax/libs/fonts/index.css" rel="stylesheet">
  <style>
    body { margin:0; padding:0; display:flex; align-items:center; min-height:100vh; }
    .slide { width:1280px; height:720px; margin:0 auto; flex-shrink:0; overflow:hidden; position:relative;
             background:#faf9f7; font-family:"Noto Sans SC",sans-serif; }
    h1,h2,h3 { font-family:"Noto Serif SC",serif; }
    .mono { font-family:"JetBrains Mono","Space Mono",monospace; font-variant-numeric:tabular-nums; }
  </style>
</head>
<body>
  <div class="slide">
    <div class="absolute left-16 top-14">
      <p class="mono text-xs text-[#b0442e] tracking-[0.3em]">11 · FAILURE CASE 1</p>
      <h1 class="mt-4 text-[42px] font-semibold text-stone-900 leading-tight">
        失败案例：模型偷偷换掉食材，而页码和数字全对
      </h1>
    </div>

    <!-- 题目与对比 -->
    <div class="absolute left-16 right-16 top-[212px]">
      <div class="bg-white border border-stone-300 px-8 py-6">
        <p class="mono text-sm text-stone-400 tracking-[0.25em]">QUESTION</p>
        <p class="mt-2 mono text-2xl text-stone-900">How to make Swedish meatballs?</p>
      </div>

      <div class="mt-10 grid grid-cols-2 gap-12">
        <div>
          <p class="mono text-xs text-stone-400 tracking-[0.25em]">教材原文</p>
          <div class="mt-3 h-px bg-stone-300"></div>
          <p class="mt-4 text-xl text-stone-700 leading-relaxed">
            食材写的是 <span class="mono text-[#b0442e] text-2xl">ground turkey</span>（火鸡肉末）
          </p>
        </div>
        <div>
          <p class="mono text-xs text-stone-400 tracking-[0.25em]">系统回答</p>
          <div class="mt-3 h-px bg-stone-300"></div>
          <p class="mt-4 text-xl text-stone-700 leading-relaxed">
            答成了<span class="text-[#b0442e] text-2xl">"鸡胸肉或牛肉末"</span>
          </p>
        </div>
      </div>
    </div>

    <!-- 根因与改进 -->
    <div class="absolute left-16 right-16 top-[492px]">
      <div class="grid grid-cols-2 gap-12">
        <div>
          <h3 class="text-xl font-semibold text-stone-900">根因：菜谱常识压过教材原文</h3>
          <p class="mt-3 text-lg text-stone-600 leading-relaxed">
            模型"知道"瑞典肉丸常用牛肉，就顺手替换了——这是 <strong class="text-stone-900">R2 最隐蔽的违规方式</strong>。
          </p>
        </div>
        <div>
          <h3 class="text-xl font-semibold text-stone-900">为什么难发现</h3>
          <p class="mt-3 text-lg text-stone-600 leading-relaxed">
            页码对、数字对、步骤也对，<strong class="text-stone-900">只有实体错了</strong>。
            自动指标全绿，只有人读才能抓到。
          </p>
        </div>
      </div>
    </div>

    <div class="absolute left-16 right-16 bottom-12">
      <div class="border-l-4 border-[#b0442e] pl-8">
        <p class="text-xl text-stone-800">
          改进方向：生成后抽取食材做集合比对，与检索原文不一致就打回重答。
          <span class="text-stone-500">（列入 P1 待办，本期未完成）</span>
        </p>
      </div>
    </div>
  </div>
</body>
</html>
