<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1280">
  <title>总结与分工</title>
  <script src="https://static.ima.qq.com/ima/pptxgen/ajax/libs/tailwind/3.4.17/index.js"></script>
  <link href="https://static.ima.qq.com/ima/pptxgen/ajax/libs/fonts/index.css" rel="stylesheet">
  <style>
    body { margin:0; padding:0; display:flex; align-items:center; min-height:100vh; }
    .slide { width:1280px; height:720px; margin:0 auto; flex-shrink:0; overflow:hidden; position:relative;
             background:#faf9f7; font-family:"Noto Sans SC",sans-serif; }
    h1,h2,h3 { font-family:"Noto Serif SC",serif; }
    .mono { font-family:"JetBrains Mono","Space Mono",monospace; font-variant-numeric:tabular-nums; }
  </style>
</head>
<body>
  <div class="slide">
    <!-- 与封面呼应的顶部标记 -->
    <div class="absolute left-16 top-14 flex items-center gap-3">
      <div class="w-10 h-1 bg-[#b0442e]"></div>
      <span class="mono text-xs tracking-[0.35em] text-stone-500 uppercase">Summary</span>
    </div>

    <!-- 一句话总结 -->
    <div class="absolute left-16 top-[128px] w-[1080px]">
      <h1 class="text-[52px] leading-[1.25] font-semibold text-stone-900">
        50 题实测，拒答正确率 <span class="text-[#b0442e]">96%</span>、页码引用 <span class="text-[#b0442e]">100%</span>；<br>
        换一本语言、题材、结构全不同的书，指标依然保持。
      </h1>
      <p class="mt-8 text-xl text-stone-500">
        管线与教材解耦——换书只改一行配置，这不是口号，是跑了两次的评测结论。
      </p>
    </div>

    <!-- 收获与分工 -->
    <div class="absolute left-16 right-16 top-[432px]">
      <div class="grid grid-cols-2 gap-14">
        <div>
          <h3 class="text-xl font-semibold text-stone-900">最大收获</h3>
          <div class="mt-3 h-px bg-stone-300"></div>
          <p class="mt-4 text-lg text-stone-600 leading-relaxed">
            用 A/B 数据和对照实验做决策，而不是凭感觉调参——
            本项目 6 次关键决策<strong class="text-stone-900">全部留痕</strong>（docs/决策日志.md），
            其中 <strong class="text-stone-900">3 次被自己的实测推翻</strong>。
          </p>
        </div>
        <div>
          <h3 class="text-xl font-semibold text-stone-900">分工</h3>
          <div class="mt-3 h-px bg-stone-300"></div>
          <p class="mt-4 text-lg text-stone-600 leading-relaxed">
            刘家暄（整体设计 + 主讲）／ 傅卓凝（模型选型）<br>
            陈涵飞（知识库）／ 陈芝聪（评测）
          </p>
          <p class="mt-3 text-base text-stone-500">
            代码由 AI 辅助生成，成员负责需求定义、方案取舍与结果验收
          </p>
        </div>
      </div>
    </div>

    <!-- 底部 -->
    <div class="absolute left-16 right-16 bottom-14">
      <div class="h-px bg-stone-300"></div>
      <div class="mt-6 flex items-center justify-between">
        <p class="text-lg text-stone-800 font-medium">谢谢 · 欢迎现场抽题</p>
        <p class="mono text-base text-stone-500">2026.10.19</p>
      </div>
    </div>
  </div>
</body>
</html>
