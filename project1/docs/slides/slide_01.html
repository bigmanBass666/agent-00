<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=1280"><title>封面</title>
<script src="https://static.ima.qq.com/ima/pptxgen/ajax/libs/tailwind/3.4.17/index.js"></script>
<link href="https://static.ima.qq.com/ima/pptxgen/ajax/libs/fonts/index.css" rel="stylesheet">
<style>
body{margin:0;padding:0;display:flex;align-items:center;min-height:100vh;background:#fff}
.slide{width:1280px;height:720px;margin:0 auto;flex-shrink:0;overflow:hidden;position:relative;background:#fff;font-family:"Noto Sans SC",sans-serif;color:#111}
h1,h2,h3{font-family:"Noto Serif SC",serif;font-weight:600;margin:0}
.mono{font-family:"JetBrains Mono",monospace;font-variant-numeric:tabular-nums}
.accent{color:#8c3b2e}
.rule{height:1px;background:#e5e5e5}
.kicker{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.32em;color:#8c3b2e}
</style>
</head>
<body><div class="slide">
  <div class="absolute left-20 top-16">
    <p class="kicker">RAG · PROJECT 01 · 2026</p>
  </div>

  <div class="absolute left-20 top-[210px] w-[980px]">
    <h1 class="text-[64px] leading-[1.18]">某课程知识库的<br>智能问答系统</h1>
    <p class="mt-10 text-2xl text-neutral-500">基于 RAG 的教材问答助手 · 项目一</p>
    <p class="mt-6 text-lg text-neutral-400">只查教材 · 逐句页码 · 检索不到如实说明 · 自动转人工</p>
  </div>

  <div class="absolute left-20 right-20 bottom-16">
    <div class="rule"></div>
    <div class="mt-6 flex items-end justify-between">
      <div>
        <p class="mono text-[11px] tracking-[.25em] text-neutral-400">GROUP</p>
        <p class="mt-2 text-lg text-neutral-800">组号 ＿＿　组名 ＿＿</p>
        <p class="mt-1 text-base text-neutral-500">刘家暄 · 傅卓凝 · 陈涵飞 · 陈芝聪</p>
      </div>
      <div class="text-right">
        <p class="mono text-[11px] tracking-[.25em] text-neutral-400">DATE</p>
        <p class="mt-2 mono text-lg text-neutral-800">2026.10.19</p>
        <p class="mt-1 text-base text-neutral-500">专业素养培养</p>
      </div>
    </div>
  </div>
</div></body></html>
