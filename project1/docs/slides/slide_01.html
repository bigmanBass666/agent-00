<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1280">
  <title>封面</title>
  <script src="https://static.ima.qq.com/ima/pptxgen/ajax/libs/tailwind/3.4.17/index.js"></script>
  <link href="https://static.ima.qq.com/ima/pptxgen/ajax/libs/fonts/index.css" rel="stylesheet">
  <style>
    body { margin:0; padding:0; display:flex; align-items:center; min-height:100vh; }
    .slide { width:1280px; height:720px; margin:0 auto; flex-shrink:0; overflow:hidden; position:relative;
             background:#faf9f7; font-family:"Noto Sans SC",sans-serif; }
    h1,h2,h3 { font-family:"Noto Serif SC",serif; }
    .mono { font-family:"JetBrains Mono","Space Mono",monospace; font-variant-numeric:tabular-nums; }
  </style>
</head>
<body>
  <div class="slide">
    <!-- 左上角标记 -->
    <div class="absolute left-16 top-14 flex items-center gap-3">
      <div class="w-10 h-1 bg-[#b0442e]"></div>
      <span class="mono text-xs tracking-[0.35em] text-stone-500 uppercase">RAG Project · 2026</span>
    </div>

    <!-- 主标题区 -->
    <div class="absolute left-16 top-[200px] w-[980px]">
      <h1 class="text-[68px] leading-[1.15] font-semibold text-stone-900">
        某课程知识库的<br>智能问答系统
      </h1>
      <div class="mt-8 flex items-center gap-5">
        <div class="w-16 h-[3px] bg-[#b0442e]"></div>
        <p class="text-2xl text-stone-600">基于 RAG 的教材问答助手 · 项目一</p>
      </div>
      <p class="mt-7 text-lg text-stone-500 leading-relaxed">
        只查教材 · 逐句页码引用 · 检索不到如实说明 · 自动转人工
      </p>
    </div>

    <!-- 底部信息条 -->
    <div class="absolute left-16 right-16 bottom-14">
      <div class="h-px bg-stone-300"></div>
      <div class="mt-6 flex items-start justify-between">
        <div>
          <p class="mono text-xs text-stone-400 tracking-[0.25em]">GROUP</p>
          <p class="mt-2 text-lg text-stone-800">组号：＿＿　组名：＿＿</p>
          <p class="mt-1 text-base text-stone-500">成员：刘家暄 · 傅卓凝 · 陈涵飞 · 陈芝聪</p>
        </div>
        <div class="text-right">
          <p class="mono text-xs text-stone-400 tracking-[0.25em]">DATE</p>
          <p class="mt-2 mono text-lg text-stone-800">2026.10.19</p>
          <p class="mt-1 text-base text-stone-500">专业素养培养</p>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
