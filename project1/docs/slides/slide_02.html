<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1280">
  <title>要解决什么问题</title>
  <script src="https://static.ima.qq.com/ima/pptxgen/ajax/libs/tailwind/3.4.17/index.js"></script>
  <link href="https://static.ima.qq.com/ima/pptxgen/ajax/libs/fonts/index.css" rel="stylesheet">
  <style>
    body { margin:0; padding:0; display:flex; align-items:center; min-height:100vh; }
    .slide { width:1280px; height:720px; margin:0 auto; flex-shrink:0; overflow:hidden; position:relative;
             background:#faf9f7; font-family:"Noto Sans SC",sans-serif; }
    h1,h2,h3 { font-family:"Noto Serif SC",serif; }
    .mono { font-family:"JetBrains Mono","Space Mono",monospace; font-variant-numeric:tabular-nums; }
  </style>
</head>
<body>
  <div class="slide">
    <!-- 标题区（固定左上） -->
    <div class="absolute left-16 top-14">
      <p class="mono text-xs text-[#b0442e] tracking-[0.3em]">01 · PROBLEM</p>
      <h1 class="mt-4 text-[42px] font-semibold text-stone-900 leading-tight">
        问题是：大模型记的是语言统计，不是你的教材
      </h1>
      <p class="mt-3 text-lg text-stone-500">让它"翻着书回答"，每个事实都能翻回原书页码</p>
    </div>

    <!-- 三条硬线 -->
    <div class="absolute left-16 top-[248px] right-16">
      <div class="grid grid-cols-3 gap-10">
        <div>
          <div class="flex items-baseline gap-3">
            <span class="mono text-[#b0442e] text-2xl font-semibold">R2</span>
            <h3 class="text-2xl font-semibold text-stone-900">只查教材</h3>
          </div>
          <div class="mt-4 h-px bg-stone-300"></div>
          <p class="mt-4 text-lg text-stone-600 leading-relaxed">
            事实依据只能来自检索到的教材原文，模型的内部知识被<strong class="text-stone-900">完全隔离</strong>。
          </p>
        </div>
        <div>
          <div class="flex items-baseline gap-3">
            <span class="mono text-[#b0442e] text-2xl font-semibold">R3</span>
            <h3 class="text-2xl font-semibold text-stone-900">必须给页码</h3>
          </div>
          <div class="mt-4 h-px bg-stone-300"></div>
          <p class="mt-4 text-lg text-stone-600 leading-relaxed">
            每个事实性陈述后标注<span class="mono text-stone-900">【教材 p.XX】</span>，可当场翻书核对。
          </p>
        </div>
        <div>
          <div class="flex items-baseline gap-3">
            <span class="mono text-[#b0442e] text-2xl font-semibold">R5</span>
            <h3 class="text-2xl font-semibold text-stone-900">没覆盖就说没有</h3>
          </div>
          <div class="mt-4 h-px bg-stone-300"></div>
          <p class="mt-4 text-lg text-stone-600 leading-relaxed">
            教材没写的，一律回答"未找到"——<strong class="text-stone-900">宁可不答，不准编造</strong>。
          </p>
        </div>
      </div>
    </div>

    <!-- 教材信息 -->
    <div class="absolute left-16 right-16 bottom-14">
      <div class="h-px bg-stone-300"></div>
      <div class="mt-6 flex items-center justify-between">
        <div>
          <p class="mono text-xs text-stone-400 tracking-[0.25em]">教材</p>
          <p class="mt-2 text-xl text-stone-800">The Anabolic Cookbook 2.0<span class="text-stone-500">（205 页 · 209 条书签 · 142 章节）</span></p>
        </div>
        <p class="text-base text-stone-500 max-w-[440px] text-right leading-relaxed">
          选它的原因：一菜一章，语义单元天然清晰；与参考案例（计算机网络）完全差异化
        </p>
      </div>
    </div>
  </div>
</body>
</html>
