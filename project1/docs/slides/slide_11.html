<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=1280"><title>四轮迭代</title>
<script src="https://static.ima.qq.com/ima/pptxgen/ajax/libs/tailwind/3.4.17/index.js"></script>
<link href="https://static.ima.qq.com/ima/pptxgen/ajax/libs/fonts/index.css" rel="stylesheet">
<style>
body{margin:0;padding:0;display:flex;align-items:center;min-height:100vh;background:#fff}
.slide{width:1280px;height:720px;margin:0 auto;flex-shrink:0;overflow:hidden;position:relative;background:#fff;font-family:"Noto Sans SC",sans-serif;color:#111}
h1,h2,h3{font-family:"Noto Serif SC",serif;font-weight:600;margin:0}
.mono{font-family:"JetBrains Mono",monospace;font-variant-numeric:tabular-nums}
.accent{color:#8c3b2e}
.rule{height:1px;background:#e5e5e5}
.kicker{font-family:"JetBrains Mono",monospace;font-size:11px;letter-spacing:.32em;color:#8c3b2e}
</style>
</head>
<body><div class="slide">
  <div class="absolute left-20 top-14">
    <p class="kicker">10 · ITERATION</p>
    <h1 class="mt-4 text-[40px]">四轮迭代：从"指标不动"到"修掉根因"</h1>
  </div>

  <div class="absolute left-20 right-20 top-[200px]">
    <table class="w-full border-collapse">
      <thead><tr class="border-b border-neutral-800">
        <th class="py-3 pr-6 text-left text-sm font-normal text-neutral-400 w-[80px]">轮次</th>
        <th class="py-3 pr-6 text-left text-sm font-normal text-neutral-400">改动</th>
        <th class="py-3 pr-6 text-left text-sm font-normal text-neutral-400 w-[170px]">拒答正确率</th>
        <th class="py-3 text-left text-sm font-normal text-neutral-400">结论</th>
      </tr></thead>
      <tbody class="text-lg">
        <tr class="border-b border-neutral-200">
          <td class="py-4 pr-6 mono text-neutral-800">R1</td>
          <td class="py-4 pr-6 text-neutral-600">基线：纯向量 + 单阈值</td>
          <td class="py-4 pr-6 mono text-neutral-800">87.5%</td>
          <td class="py-4 text-neutral-400">—</td>
        </tr>
        <tr class="border-b border-neutral-200">
          <td class="py-4 pr-6 mono text-neutral-800">R2</td>
          <td class="py-4 pr-6 text-neutral-600">加混合召回 + 重写 Prompt</td>
          <td class="py-4 pr-6 mono accent">87.5%（零提升）</td>
          <td class="py-4 text-neutral-900">改动生效了吗？没有 → 查管道</td>
        </tr>
        <tr class="border-b border-neutral-200">
          <td class="py-4 pr-6 mono text-neutral-800">R3</td>
          <td class="py-4 pr-6 text-neutral-600">修复 context 截断 bug</td>
          <td class="py-4 pr-6 mono accent font-semibold">93.8%</td>
          <td class="py-4 text-neutral-900">真凶：<span class="mono text-base">text[:2000]</span> 切掉了 38% 长块的后半段</td>
        </tr>
        <tr>
          <td class="py-4 pr-6 mono text-neutral-800">R4</td>
          <td class="py-4 pr-6 text-neutral-600">表格结构化（find_tables）</td>
          <td class="py-4 pr-6 mono text-neutral-800">90.5%</td>
          <td class="py-4 text-neutral-900">页码定位 93.1% → 96.6%</td>
        </tr>
      </tbody>
    </table>
  </div>

  <div class="absolute left-20 right-20 bottom-16">
    <div class="rule"></div>
    <p class="mt-6 text-[26px] text-neutral-900 leading-snug">指标异常时，<span class="accent">先查数据管道，别急着换算法。</span></p>
    <p class="mt-2 text-lg text-neutral-500">R2 的"零提升"不是方法错了——检索一直是对的，是上下文在喂给模型之前被自己截断了。</p>
  </div>
</div></body></html>
